# =============================================================================
# publications.yml — Single source of truth for all publications and preprints
# =============================================================================
# Fields:
#   title          : Full title of the work (required)
#   authors        : Author string as it appears in citations (required)
#   year           : Publication or preprint year, integer (required)
#   type           : journal | conference | book | poster | preprint (required)
#   status         : published | accepted | submitted | under_review | preprint
#   quartile       : Q1 | Q2 (published journals only)
#   journal        : Journal name
#   venue          : Conference or workshop name
#   submission_to  : Journal or conference where the manuscript was submitted
#   preprint_server: arXiv | SSRN
#   preprint_id    : Preprint identifier
#   preprint       : Full URL to the preprint
#   impact_factor  : Numeric IF (published journals only)
#   metrics_year   : Year of the IF/ranking data
#   metrics_detail : Full ranking string for display
#   doi            : Full DOI URL
#   scholar        : Google Scholar citation URL
#   pdf            : Relative path to PDF
#   code           : GitHub or external code URL
#   note           : Short annotation
#   featured       : true | false
# =============================================================================


